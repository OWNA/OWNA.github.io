name: Limitless books
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull books
        run: |
          node <<'NODE'
          const fs = require("fs");
          (async () => {
            const STABLES=[{kind:"5m",slug:"btc-5min-price"},{kind:"15m",slug:"btc-15min-price"}];
            const markets=[];
            for (const s of STABLES) {
              const r = await fetch("https://api.limitless.exchange/markets/stable/"+s.slug);
              if (!r.ok) throw new Error(s.slug+" "+r.status);
              const m = await r.json();
              const prices = (m.prices||[0.5,0.5]).map(Number);
              markets.push({
                id:String(m.id||s.slug), title:String(m.title||("BTC Up or Down - "+s.kind)),
                slug:String(m.slug||s.slug), kind:s.kind, venue:"limitless",
                up:prices[0]||0.5, down:prices[1]||1-(prices[0]||0.5),
                volume:Number(m.volume||0), end:Number(m.expirationTimestamp||0),
                href:"https://limitless.exchange/markets/"+s.slug,
                upToken:String(m.tokens?.yes||""), downToken:String(m.tokens?.no||""),
              });
            }
            fs.mkdirSync("docs",{recursive:true});
            fs.writeFileSync("docs/ll-books.json", JSON.stringify({ts:Date.now(), markets},null,2)+"\n");
            console.log(markets.map(m=>m.kind+" "+m.up+"/"+m.down).join(" · "));
          })().catch(e=>{console.error(e); process.exit(1);});
          NODE
      - name: Commit
        run: |
          git config user.name "parity-desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ll-books.json
          git diff --cached --quiet && echo unchanged && exit 0
          git commit -m "chore: refresh Limitless books"
          git push
